<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Job Offer Analyzer - Hikari AI</title>

    <style>
        /* Reset default browser settings */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0d0d1a;
            color: #f5f5f5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #14142b;
            padding: 2rem;
            text-align: center;
            box-shadow: 0px 4px 12px rgba(0, 255, 255, 0.2);
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #00ffff;
        }

        header p {
            font-size: 1.1rem;
            color: #ccc;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            gap: 20px;
        }

        textarea {
            width: 90%;
            max-width: 700px;
            height: 250px;
            background-color: #1a1a2e;
            color: #fff;
            font-size: 1rem;
            padding: 1rem;
            border-radius: 12px;
            border: none;
            box-shadow: 0px 0px 10px rgba(0, 255, 255, 0.2);
            resize: none;
        }

        button {
            background-color: #00ffff;
            color: #0d0d1a;
            font-size: 1.2rem;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0px 4px 10px rgba(0, 255, 255, 0.5);
        }

        button:hover {
            background-color: #00cccc;
            transform: scale(1.05);
        }

        #result {
            margin-top: 1rem;
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            padding: 1.5rem;
            border-radius: 10px;
            width: 90%;
            max-width: 700px;
            transition: all 0.3s ease;
        }

        .safe {
            background-color: #003300;
            color: #00ff00;
            box-shadow: 0px 0px 20px rgba(0, 255, 0, 0.6);
        }

        .danger {
            background-color: #330000;
            color: #ff3333;
            box-shadow: 0px 0px 20px rgba(255, 0, 0, 0.6);
        }

        footer {
            background-color: #14142b;
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
            color: #aaa;
            margin-top: auto;
        }
    </style>

</head>
<body>

    <header>
        <h1>🕵️‍♂️ Fake Job Offer Analyzer</h1>
        <p>Paste the job offer email below and let it scan for suspicious signs.</p>
    </header>

    <main>
        <textarea id="jobOfferInput" placeholder="Paste your job offer email text here..."></textarea>
        <button onclick="analyzeOffer()">Analyze Offer</button>

        <div id="result"></div>
    </main>

    <footer>
        <p>Created by Pranav Tripathi and Varchasva Vikram Singh</p>
    </footer>

    <script>
        // List of suspicious keywords that indicate potential fake job offers
        const suspiciousKeywords = [
            "no interview",
            "quick money",
            "urgent hiring",
            "passport needed",
            "work visa arranged",
            "no experience required",
            "easy money",
            "cash payment",
            "no id required",
            "upfront payment",
            "travel provided",
            "earn from home",
            "investment needed",
            "no documents",
            "fast cash",
            "wire transfer",
            "send money first",
            "personal assistant urgently",
            "lottery winner",
            "pay for training",
            "fees required",
            "payment in advance",
            "keep it confidential"
        ];

        function analyzeOffer() {
            const inputText = document.getElementById("jobOfferInput").value.toLowerCase();
            const resultDiv = document.getElementById("result");

            let foundKeywords = [];

            suspiciousKeywords.forEach(keyword => {
                if (inputText.includes(keyword)) {
                    foundKeywords.push(keyword);
                }
            });

            if (foundKeywords.length > 0) {
                resultDiv.innerHTML = `
                    <p>⚠️ <strong>Warning!</strong> This job offer looks suspicious.</p>
                    <p>Detected Red Flags:</p>
                    <ul>
                        ${foundKeywords.map(word => `<li>${word}</li>`).join('')}
                    </ul>
                `;
                resultDiv.className = "danger";
            } else {
                resultDiv.innerHTML = `
                    <p>✅ <strong>Good News!</strong> This job offer appears safe.</p>
                `;
                resultDiv.className = "safe";
            }
        }
    </script>

</body>
</html>
